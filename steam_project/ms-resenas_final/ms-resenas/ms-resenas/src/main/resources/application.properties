spring.application.name=ms-resenas
server.port=8085
spring.datasource.url=jdbc:mysql://localhost:3306/db_resenas?createDatabaseIfNot=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
ms.usuarios.url=http://localhost:8081
ms.juegos.url=http://localhost:8082
ms.biblioteca.url=http://localhost:8083
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
spring.profiles.active=dev