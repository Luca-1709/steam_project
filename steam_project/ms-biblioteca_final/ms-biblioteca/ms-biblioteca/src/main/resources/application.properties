spring.application.name=ms-biblioteca
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/db_biblioteca?createDatabaseIfNot=true
spring.datasource.username=root
spring.datasource.password=

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
ms.usuarios.url=http://localhost:8081
ms.juegos.url=http://localhost:8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/doc/swagger-ui/index.html