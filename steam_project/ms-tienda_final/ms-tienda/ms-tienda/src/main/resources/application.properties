spring.application.name=ms-tienda
server.port=8084
spring.datasource.url=jdbc:mysql://localhost:3306/db_tienda?createDatabaseIfNot=true

spring.datasource.username=root
spring.datasource.password=

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

ms.usuarios.url=http://localhost:8081
ms.juegos.url=http://localhost:8082
ms.biblioteca.url=http://localhost:8083